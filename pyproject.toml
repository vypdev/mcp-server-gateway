[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gateway-node"
version = "0.1.0"
description = "Per-host MCP gateway for controlled infrastructure operations"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.13,<2",
  "psutil>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
gateway-node-server = "gateway_node.main:main"
gateway-node = "gateway_node.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
